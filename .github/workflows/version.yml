name: Versionamento

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Validar versionamento
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Testar as regras de versão
        run: npm run test:version
      - name: Validar formato, sincronização e sequência
        run: npm run version:check
